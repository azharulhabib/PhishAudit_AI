<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon48.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhishAudit AI - Admin Dashboard</title>
    <!-- Prevent initial flash of wrong theme (FOUC) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('phishAudit_theme');
          var theme = saved || 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
